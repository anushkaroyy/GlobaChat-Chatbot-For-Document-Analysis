<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlobaChat</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.3.1/css/bootstrap.min.css"
  />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #000033; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; 
      margin: 0;
      color: #000033; 
      overflow-y: auto;
    }

    .container {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      padding: 30px;
      max-width: 800px; 
      width: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      height: 80vh; 
    }

    h2 {
      text-align: center;
      color: #5c6bc0;
      font-size: 1.8em;
      margin-bottom: 20px;
    }

    .form-control {
      border-radius: 25px;
      padding: 15px;
      font-size: 1.1em;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    button {
      width: 100%;
      border-radius: 25px;
      padding: 15px;
      font-size: 1.2em;
      background-color: #4caf50;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #45a049;
    }

    #response {
      margin-top: 20px;
      padding: 20px;
      background-color: #e1e1e1; 
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      min-height: 50px;
      color: black; 
      overflow-y: auto; 
      flex-grow: 1; 
    }

    #response h3 {
      color: black;
      font-size: 1.2em;
    }

    #response strong {
      color: #d9534f;
    }

    #response ul {
      padding-left: 20px;
    }

    #response li {
      margin-bottom: 5px;
    }

    .loading {
      font-size: 1.2em;
      color: #2196f3;
      font-weight: bold;
      text-align: center;
    }

  </style>
</head>
<body>
  <div class="container">
    <h2>GlobaChat</h2>
    <div class="form-group">
      <input
        type="text"
        class="form-control"
        id="userInput"
        placeholder="Ask me questions about the pdf!"
      />
    </div>
    <button class="btn btn-success" onclick="sendMessage()">Ask!</button>
    <div id="response"></div>
  </div>

  <script>
    async function sendMessage() {
      const input = document.getElementById('userInput').value;
      const responseDiv = document.getElementById('response');
      const loadingMessage = '<div class="loading">Loading...</div>';

      if (!input) {
        responseDiv.innerHTML = '<div class="text-danger">Please enter a message.</div>';
        return;
      }

      responseDiv.innerHTML = loadingMessage;

    
      let summaryText = await fetchSummaryText();

   
      const userMessage = `Based on this text: ${summaryText} Answer the question: ${input}`;

      try {
        const response = await fetch(
          'https://openrouter.ai/api/v1/chat/completions',
          {
            method: 'POST',
            headers: {
              Authorization: 'Bearer YOUR_OPENROUTER_API_KEY',
              'HTTP-Referer': 'https://www.sitename.com',
              'X-Title': 'SiteName',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              model: 'deepseek/deepseek-r1:free',
              messages: [{ role: 'user', content: userMessage }],
            }),
          }
        );
        const data = await response.json();
        console.log(data);

        const markdownText =
          data.choices?.[0]?.message?.content || 'No response received.';
        responseDiv.innerHTML = marked.parse(markdownText);
      } catch (error) {
        responseDiv.innerHTML = `<div class="text-danger">Error: ${error.message}</div>`;
      }
    }

    async function fetchSummaryText() {
      try {
        const response = await fetch('summary_output.txt'); 
        if (!response.ok) throw new Error('Failed to fetch summary text');
        const text = await response.text();
        return text;
      } catch (error) {
        console.error(error);
        return 'Could not load summary text.';
      }
    }
  </script>
</body>
</html>
